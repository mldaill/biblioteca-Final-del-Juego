services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: biblioteca
    user: 1000:1000
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"

  fastapi-app:
    build: .
    environment:
      DB_URL: postgresql://postgres:5432/biblioteca
      DB_NAME: biblioteca
      DB_USER: admin 
      DB_PASSWORD: admin 
      DB_HOST: postgres

    ports:
      - "3000:3000"
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 3000 --reload

  frontend:
    build:
      context: ./frontend  
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app  
    working_dir: /app  
    command: npm run start
