version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: postgres_library
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - library_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

volumes:
  library_data: